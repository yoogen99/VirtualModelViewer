name: Checks
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m compileall -q fusion_addon
      - run: node --check fusion_addon/VirtualModelViewer/palette.js
      - run: pnpm setup:cloudflare --dry-run
      - run: pnpm build
      - run: pnpm exec wrangler deploy --dry-run
      - run: pnpm package:addon
      - run: pnpm package:fusion
      - uses: actions/upload-artifact@v4
        with:
          name: addons
          path: artifacts/*.zip
