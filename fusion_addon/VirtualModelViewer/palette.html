<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VirtualModelViewer</title>
<style>
:root{font-family:system-ui,sans-serif;background:#12241e;color:#edf2ec}*{box-sizing:border-box}body{margin:0;padding:22px}h1{font-size:21px;margin:0 0 8px}h2{font-size:15px;margin:0 0 16px}p{font-size:12px;line-height:1.8;color:#b7cbbd}section{background:#1b3228;padding:18px;border:1px solid #3c5745;border-radius:12px;margin-top:18px}label{display:block;font-size:12px;margin-top:12px}input,button{font:inherit;width:100%;border:1px solid #59705f;border-radius:7px;padding:11px;background:#223c2e;color:#edf2ec;margin-top:8px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button.primary{background:#c2e793;color:#182d19;font-weight:700}button.danger{color:#ffbaac}button:focus-visible,input:focus-visible{outline:3px solid #c2e793;outline-offset:2px}.row{display:flex;gap:10px}#qr{width:180px;max-width:100%;display:block;margin:16px auto;background:white;border-radius:6px}#status{overflow-wrap:anywhere;color:#d4e8bf}#sizes{white-space:pre-line;font-size:13px;line-height:1.8}[hidden]{display:none!important}input[readonly]{font-size:11px}small{color:#b7cbbd}
</style></head><body>
<h1>VirtualModelViewer</h1><p>モデルを、目の前の空間へ。実寸 100%。</p>
<section><h2>配信先の設定</h2>
<label>HTTPS URL<input id="server" type="url" placeholder="https://your-worker.workers.dev" autocomplete="off"></label>
<label>管理用トークン<input id="token" type="password" autocomplete="off" placeholder="32文字以上"></label>
<p id="token-state">トークンはFusion終了時に破棄されます。</p><button id="settings">設定を反映</button></section>
<section><h2>モデルを送信</h2><button id="new" class="primary">ARで確認（新規リンク）</button><button id="update">選択モデルで更新</button>
<p>ボディ・コンポーネントを選び、寸法を確認して送信します。期限は最終更新から24時間。</p><p id="status" role="status">Fusionの「実寸AR」から開いてください。</p></section>
<section id="model" hidden><h2 id="name">公開中のモデル</h2><div id="sizes"></div><p id="expires"></p>
<input id="link" readonly aria-label="モデルのURL"><div class="row"><button id="copy">リンクをコピー</button><button id="open">ブラウザで開く</button></div>
<img id="qr" alt="モデルを開くQRコード" hidden><button id="qr-button">QRコードを表示</button><button id="delete" class="danger">公開モデルを削除</button>
<p>リンク情報を保持するにはデザインを保存してください。更新は端末側でARを閉じて開き直します。</p></section>
<button id="refresh">表示を更新</button>
<script src="palette.js"></script></body></html>
